environment: production

server:
  port: 4001
  timeout: "90s"
  enable_log_file: false

security:
  jwt_secret: "tu_secreto_jwt_super_seguro_produccion_azure"

database:
  oracle:
    user: "LAB1"
    password: "tu_password_oracle_produccion"
    connect_string: "IP_SERVIDOR_ORACLE:1521/ORCLPDB"
    pool:
      min: 1
      max: 10
      increment: 1
      timeout: 60
    call_timeout: 30000
